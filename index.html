<!DOCTYPE html>
<html lang="ja">
    <head>
        <title>レシピサイト</title>
        <meta name="description" content="晩御飯のレシピを公開"
    </head>
    <body>
        <h1>油淋豚</h1>
        <h2>作り方</h2>
        <ol>
            <li>豚バラ（500g）をパックの形のままフライパンへ</li>
            <li>両面に塩コショウ</li>
            <li>酒大さじ4を入れて、もみこむ</li>
            <li>片栗粉大さじ4ずつ両面にかける</li>
            <li>開いている周りにごま油大さじ4を入れる</li>
            <li>カリッとするまで中火で5分ほど焼く</li>
            <li>裏返して裏面も5分ほど焼く</li>
            <li>キャベツ千切り、トマト輪切りを皿に盛る</li>
            <li>豚バラを細く切ってのせる</li>
        </ol>
        <h2>できあがり</h2>
    </body>
</html>
